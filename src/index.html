<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CentralTok</title>
    <meta name="description" content="A video sharing platform with a personalized algorithm, messaging, and real-time activity." />
    <meta property="og:title" content="CentralTok" />
    <meta property="og:description" content="A video sharing platform with a personalized algorithm, messaging, and real-time activity." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages redirect handler
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&') 
          }).reduce(function(acc, s) {
            var parts = s.split('=');
            acc[parts[0]] = parts[1] && decodeURIComponent(parts[1].replace(/\+/g, ' '));
            return acc;
          }, {});
          if (decoded.p !== undefined) {
            window.history.replaceState(null, null,
                l.pathname.slice(0, -1) + (decoded.p || '') +
                (decoded.q ? '?' + decoded.q : '') +
                l.hash
            );
          }
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
